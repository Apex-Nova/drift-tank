# =====================================================================
#  Builds every version of Drift Tank on GitHub's computers (free for public repos):
#    - Windows app   (Drift-Tank-Windows.zip)   built on a Windows machine
#    - Web version   (published to GitHub Pages: https://<user>.github.io/<repo>/)
#    - Android app   (Drift-Tank-Android.apk)   the web version wrapped with Capacitor
#
#  Runs when you push a tag like v1.0   ->  files are attached to a GitHub Release
#  or by hand: GitHub -> Actions -> "Build all versions" -> Run workflow
#  (then download the files from the run's "Artifacts" box).
# =====================================================================
name: Build all versions

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write      # attach files to the Release
  pages: write         # publish the web version
  id-token: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pygame-ce pyinstaller pillow certifi
      - name: Build Drift Tank.exe
        shell: bash
        run: ./build_app.sh
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "dist/Drift Tank" -DestinationPath Drift-Tank-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Drift-Tank-Windows
          path: Drift-Tank-Windows.zip

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install pygbag certifi
      - name: Build web version
        run: ./build_web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Drift-Tank-Web
          path: build/web/drift-tank/build/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/drift-tank/build/web

  pages:
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: true      # turn on Pages first: Settings -> Pages -> Source: GitHub Actions
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Drift-Tank-Web
          path: web_build
      - name: Copy web build into the app (renames the .gz file Android would break)
        run: ./android_app/prepare_www.sh ../web_build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build APK
        working-directory: android_app
        run: |
          npm install
          npx cap add android
          ./patch_android.sh      # landscape only, like a console game
          npx cap sync android
          cd android && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../Drift-Tank-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Drift-Tank-Android
          path: Drift-Tank-Android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
      - name: Zip web build
        run: cd files/Drift-Tank-Web && zip -r ../../Drift-Tank-Web.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            files/Drift-Tank-Windows/Drift-Tank-Windows.zip
            files/Drift-Tank-Android/Drift-Tank-Android.apk
            Drift-Tank-Web.zip
          body: |
            **Windows:** unzip, open the folder, double-click `Drift Tank.exe` (click "More info -> Run anyway" if Windows warns).
            **Android:** download the .apk on your phone and open it (allow "install unknown apps"). Needs internet the first time.
            **Mac:** attach `DriftTank-mac.zip` yourself (built with ./build_app.sh on a Mac).
            **Web:** play in the browser on the GitHub Pages link of this repo.
